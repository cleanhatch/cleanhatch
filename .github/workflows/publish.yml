name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "${{ github.workspace }}"/dist/*.whl
          python -m unittest discover -s "${{ github.workspace }}/tests" -v
          cleanhatch --version
          python -c "from importlib.metadata import version; import cleanhatch; assert version('cleanhatch') == cleanhatch.__version__ == '0.0.1a0'"
      - name: Test source distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall "${{ github.workspace }}"/dist/*.tar.gz
          python -m unittest discover -s "${{ github.workspace }}/tests" -v
          cleanhatch --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cleanhatch/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
